about:
  eyebrow: 关于本站
  title: 一叶方舟，从这里开始
  body: |
    这是「猎武神」的个人博客。「一叶方舟」——一片叶子，也能载着想法渡河。

    这里把工程实践、技术思考和偶尔的生活片段写下来。更新不快，但尽量写清楚：一件事为什么这样做、踩过哪些坑、后来又是怎么想明白的。

    常写的话题：

    - 工程实践与踩坑复盘
    - 工具、效率与一点方法
    - 读书与生活随想

    可以从 [博客文章](/blog/post/) 开始，或直接读 [最近的一篇](/blog/post/e-piano-playing-records/)。
