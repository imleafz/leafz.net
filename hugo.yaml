# OINK Starter — the only site configuration file.
# Identity, languages, outputs, and optional integrations are configured below.

title: &siteTitle 一叶方舟
baseURL: https://leafz.net/
defaultContentLanguage: zh
disableLanguages: [en, fr]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: Blogs, and Documentation, updates, guides for my projects.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 我的博客、项目文档、动态与指南。
  # Keep French declared so Hugo recognizes .fr.md as a disabled translation.
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: *siteTitle
    params:
      description: Documentation, actualités et guides de votre projet.

# OINK's Markdown components depend on these three Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS, NAVJSON]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: 猎武神
    from_year: 2013
  github_repo: https://github.com/imleafz/leafz.net
  github_branch: main
  footer_center_info: ''
  ui:
    # Visual preset (OINK 1.2+). paper is the new default; slate keeps the 1.1 look.
    # preset_menu lets readers switch style and light/dark from the navbar.
    preset: paper
    preset_menu: true
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    theme_color: '#1f4e79'
    typography: technical
    image_zoom: true
    share: [email, copy]
    footer_style: slim
    # feedback:
    #   enable: true
    #   reasons: true

  # Optional brand assets. The starter already supplies a neutral logo.
  # logo: icons/logo.svg
  # wordmark: icons/wordmark.svg

  # Giscus comments. Loads only when the whole block is set.
  comments:
    enable: true
    type: giscus
    giscus:
      repo: imleafz/leafz.net
      repoId: R_kgDOU43g8A
      category: Announcements
      categoryId: DIC_kwDOU43g8M4DG5rj
      mapping: pathname
      inputPosition: bottom
      theme: auto
      loading: lazy

  # Optional layout choice. Theme defaults remain active while commented.
  # page_width: wide

# Optional Google Analytics. Production builds only; previews stay untracked.
# services:
#   googleAnalytics:
#     id: G-XXXXXXXXXX

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1

# 仅供 hugo server 本地预览：giscus iframe 从 giscus.app 跨源加载本机的
# 预设样式表（/css/giscus-*-bundle.css），需要放行 CORS 才能预览评论主题。
# 线上（GitHub Pages）自带 access-control-allow-origin: *，无需此项。
server:
  headers:
    - for: /css/**
      values:
        Access-Control-Allow-Origin: '*'
